[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edapreplib"
version = "0.1.0"
description = "Automated EDA reports and machine learning readiness assessment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "openpyxl",
    "matplotlib",
    "seaborn"
]

[tool.setuptools.packages.find]
include = ["edapreplib*"]
